<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgWarmCraft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="50%" stop-color="#fae8ff" />
      <stop offset="100%" stop-color="#f5d0fe" />
    </linearGradient>
    <linearGradient id="bambooGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#fafaf9" />

  <!-- Background decorative craft geometric pattern -->
  <g stroke="#d6d3d1" stroke-width="2" fill="none" opacity="0.4">
    <pattern id="weave" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L20 0 L40 20 L20 40 Z" fill="#f5f5f4" />
      <line x1="0" y1="0" x2="40" y2="40" />
      <line x1="40" y1="0" x2="0" y2="40" />
    </pattern>
    <rect width="1200" height="800" fill="url(#weave)" />
  </g>

  <!-- Wooden Craft Table Surface -->
  <rect x="0" y="550" width="1200" height="250" fill="#a16207" />
  <rect x="0" y="550" width="1200" height="20" fill="#ca8a04" />

  <!-- Big Woven Bamboo Basket (Besek & Bakul Anyaman Bambu) -->
  <g transform="translate(360, 260)">
    <!-- Main Woven Basket -->
    <ellipse cx="240" cy="180" rx="200" ry="80" fill="#ca8a04" />
    <!-- Basket Body -->
    <path d="M40 180 Q240 400 440 180 L410 320 Q240 480 70 320 Z" fill="url(#bambooGrad)" stroke="#713f12" stroke-width="3" />
    <!-- Woven texture lines horizontal -->
    <path d="M50 220 Q240 420 430 220" stroke="#713f12" stroke-width="4" fill="none" stroke-dasharray="12 6" />
    <path d="M60 260 Q240 440 420 260" stroke="#713f12" stroke-width="4" fill="none" stroke-dasharray="14 7" />
    <path d="M68 300 Q240 460 412 300" stroke="#713f12" stroke-width="4" fill="none" stroke-dasharray="14 7" />

    <!-- Basket Top Rim -->
    <ellipse cx="240" cy="180" rx="200" ry="30" fill="none" stroke="#713f12" stroke-width="8" />
    <ellipse cx="240" cy="180" rx="195" ry="27" fill="#fef08a" opacity="0.3" />

    <!-- Two Traditional Besek Boxes on Side -->
    <g transform="translate(340, 90)">
      <!-- Besek Bottom -->
      <polygon points="60,110 160,80 240,120 140,150" fill="#eab308" stroke="#854d0e" stroke-width="2" />
      <polygon points="60,110 60,160 140,200 140,150" fill="#ca8a04" stroke="#854d0e" stroke-width="2" />
      <polygon points="140,150 140,200 240,170 240,120" fill="#a16207" stroke="#854d0e" stroke-width="2" />
      <!-- Besek Lid slightly ajar -->
      <polygon points="70,90 170,60 250,100 150,130" fill="#facc15" stroke="#713f12" stroke-width="2" />
    </g>
  </g>

  <!-- Fresh Bamboo Stalks in Background -->
  <g transform="translate(180, 160)">
    <rect x="0" y="0" width="16" height="420" fill="#15803d" rx="4" />
    <line x1="0" y1="80" x2="16" y2="80" stroke="#166534" stroke-width="4" />
    <line x1="0" y1="180" x2="16" y2="180" stroke="#166534" stroke-width="4" />
    <line x1="0" y1="280" x2="16" y2="280" stroke="#166534" stroke-width="4" />
    <rect x="40" y="40" width="14" height="380" fill="#16a34a" rx="4" />
    <line x1="40" y1="120" x2="54" y2="120" stroke="#15803d" stroke-width="4" />
    <line x1="40" y1="230" x2="54" y2="230" stroke="#15803d" stroke-width="4" />
  </g>

  <!-- Badge -->
  <rect x="40" y="680" width="370" height="75" rx="20" fill="#064e3b" opacity="0.95" />
  <text x="65" y="718" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="bold" fill="#ffffff">🧺 Anyaman Bambu Tradisional</text>
  <text x="65" y="742" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#fef08a">Kerajinan Tangan Ramah Lingkungan</text>
</svg>
