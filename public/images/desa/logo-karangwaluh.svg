<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Perisai / Shield -->
  <path d="M50 5 L88 20 C88 60 50 92 50 92 C50 92 12 60 12 20 Z" fill="url(#shieldGrad)" stroke="#f59e0b" stroke-width="2.5" />
  <!-- Lingkaran dalam -->
  <circle cx="50" cy="46" r="28" fill="#ffffff" opacity="0.1" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="2 2" />
  
  <!-- Siluet Joglo Tradisional Ponorogo -->
  <path d="M50 25 L68 37 L64 37 L60 48 L40 48 L36 37 L32 37 Z" fill="url(#goldGrad)" />
  <!-- Pilar Joglo -->
  <rect x="42" y="48" width="3" height="12" fill="#fef3c7" />
  <rect x="55" y="48" width="3" height="12" fill="#fef3c7" />
  <rect x="36" y="52" width="2.5" height="8" fill="#fef3c7" />
  <rect x="61.5" y="52" width="2.5" height="8" fill="#fef3c7" />
  <rect x="33" y="60" width="34" height="2.5" rx="1" fill="#fef3c7" />
  
  <!-- Tangkai Padi Kiri & Kapas Kanan -->
  <!-- Butir Padi (Kiri) -->
  <path d="M30 65 C26 55 27 40 33 30" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="28" cy="58" r="2.2" fill="#fbbf24" />
  <circle cx="26" cy="50" r="2.2" fill="#fbbf24" />
  <circle cx="28" cy="42" r="2.2" fill="#fbbf24" />
  <circle cx="31" cy="35" r="2.2" fill="#fbbf24" />
  
  <!-- Kapas (Kanan) -->
  <path d="M70 65 C74 55 73 40 67 30" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="72" cy="58" r="2.5" fill="#f0fdf4" stroke="#10b981" stroke-width="1" />
  <circle cx="74" cy="50" r="2.5" fill="#f0fdf4" stroke="#10b981" stroke-width="1" />
  <circle cx="72" cy="42" r="2.5" fill="#f0fdf4" stroke="#10b981" stroke-width="1" />
  
  <!-- Pita Semboyan Bawah -->
  <path d="M28 72 Q50 78 72 72 L70 80 Q50 85 30 80 Z" fill="url(#goldGrad)" />
  <text x="50" y="78.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.2" font-weight="bold" fill="#064e3b" text-anchor="middle" letter-spacing="0.5">KARANGWALUH</text>
  
  <!-- Bintang Kejayaan di Atas -->
  <polygon points="50,14 51.5,17.5 55,17.5 52,19.5 53.5,23 50,21 46.5,23 48,19.5 45,17.5 48.5,17.5" fill="#fef3c7" />
